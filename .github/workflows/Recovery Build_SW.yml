name: Recovery Build (Legacy)

on:
  workflow_dispatch:
    inputs:
      IMG_URL:
        description: 'IMG_URL (optional). Leave EMPTY to use recovery.img committed in the repo root'
        required: false
        default: 'https://github.com'
      MANIFEST_URL:
        description: 'MANIFEST_URL (if want to use SSH keys, use git@github.com:XXXXX)'
        required: true
        default: 'https://github.com'
      MANIFEST_BRANCH:
        description: 'MANIFEST_BRANCH'
        required: true
        default: 'twrp-8.1'
      BUILD_TARGET:
        description: 'BUILD_TARGET'
        required: true
        default: 'recovery'

jobs:
  build:
    if: github.event.repository.owner.id == github.event.sender.id
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Display Run Parameters
        run: |
          echo "::group::User Environment Variables"
          echo "Image URL: ${{ github.event.inputs.IMG_URL }}"
          echo "Manifest URL: ${{ github.event.inputs.MANIFEST_URL }}"
          echo "Manifest Branch: ${{ github.event.inputs.MANIFEST_BRANCH }}"
          echo "Build Target: ${{ github.event.inputs.BUILD_TARGET }}.img"
          echo "::endgroup::"

      - name: Check Out
        uses: actions/checkout@v4

      - name: Cleanup
        uses: rokibhasansagar/slimhub_actions@main

      - name: Prepare the environment
        run: |
          sudo apt update
          sudo apt -y upgrade
          sudo apt -y install gperf gcc-multilib gcc-10-multilib g++-multilib g++-10-multilib libc6-dev lib32ncurses5-dev x11proto-core-dev libx11-dev tree lib32z-dev libgl1-mesa-dev libxml2-utils xsltproc bc ccache lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev libwxgtk3.0-gtk3-dev libxml2 lzop pngcrush schedtool squashfs-tools imagemagick libbz2-dev lzma ncftp qemu-user-static libstdc++-10-dev libncurses5 python3
          sudo apt -y install python3 python3-pip cpio wget file
          pip3 install twrpdtgen

      - name: Install OpenJDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '8'

      - name: Setup SSH Keys
        if: ${{ startsWith(github.event.inputs.MANIFEST_URL, 'git@github.com') }}
        uses: webfactory/ssh-agent@v0.5.4
        with:
            ssh-private-key: |
                ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Install repo
        run: |
          mkdir ~/bin
          curl https://googleapis.com > ~/bin/repo
          chmod a+x ~/bin/repo
          sudo ln -sf ~/bin/repo /usr/bin/repo

      - name: Initialize repo
        id: pwd
        run: |
          mkdir workspace
          cd workspace
          echo "workspace-folder=$(pwd)" >> $GITHUB_OUTPUT
          git config --global user.name "azwhikaru"
          git config --global user.email "azwhikaru+37921907@github.com"
          repo init --depth=1 -u ${{ github.event.inputs.MANIFEST_URL }} -b ${{ github.event.inputs.MANIFEST_BRANCH }}

      - name: Check Build Tree
        uses: haya14busa/action-cond@v1
        id: buildtree
        with:
          cond: ${{ github.event.inputs.MANIFEST_BRANCH == 'twrp-11' || github.event.inputs.MANIFEST_BRANCH == 'twrp-12.1' }}
          if_true: twrp
          if_false: omni

      - name: Repo Sync
        run: |
          for i in {1..3}; do
            repo sync -j4 --force-sync && break
            echo "Repo sync failed, retrying..."
            sleep 5
          done
        working-directory: workspace

      - name: Get recovery image
        env:
          IMG_URL: ${{ github.event.inputs.IMG_URL }}
        run: |
          if [ -n "$IMG_URL" ]; then
            echo "Downloading $IMG_URL"
            wget -O recovery.img "$IMG_URL"
          else
            echo "Using recovery.img from repository root"
            cp "${GITHUB_WORKSPACE}/recovery.img" recovery.img
          fi
          ls -l recovery.img
          file recovery.img
          sha256sum recovery.img
          if [ "$(head -c 8 recovery.img)" != "ANDROID!" ]; then
            echo "::error::recovery.img is not an Android boot image (HTML page or wrong file?)"
            head -c 300 recovery.img
            exit 1
          fi
        working-directory: ${{ steps.pwd.outputs.workspace-folder }}

      - name: Generate Device Tree
        id: gdt
        run: |
          python3 ${GITHUB_WORKSPACE}/scripts/build.py -i recovery.img -o device
        working-directory: ${{ steps.pwd.outputs.workspace-folder }}

      - name: Normalize Device Tree
        id: normalize
        working-directory: ${{ steps.pwd.outputs.workspace-folder }}
        run: |
          set -e
          TREE="${{ steps.gdt.outputs.DEVICE_PATH }}"
          echo "Generated tree path: $TREE"
          if [ ! -d "$TREE" ]; then
            echo "::error::Generated device tree path not found!"
            exit 1
          fi
          CODENAME=$(basename "$TREE")

          cd "$TREE"
          MK=""
          for f in omni_*.mk twrp_*.mk; do
            if [ -f "$f" ]; then
              MK="$f"
              break
            fi
          done
          if [ -z "$MK" ]; then
            echo "::error::No omni_/twrp_ makefile found in $TREE"
            ls -l
            exit 1
          fi
          if [[ "$MK" == twrp_* ]]; then
            mv "$MK" "omni_${CODENAME}.mk"
            MK="omni_${CODENAME}.mk"
          fi
          cd - > /dev/null

          rm -f "$TREE/Android.bp"

          echo "codename=${CODENAME}" >> $GITHUB_OUTPUT
          echo "tree=${TREE}" >> $GITHUB_OUTPUT
          echo "makefile_name=${MK%.mk}" >> $GITHUB_OUTPUT
          echo "Codename: $CODENAME / Makefile: ${MK%.mk}"

      - name: Apply SM-T583 device values
        working-directory: ${{ steps.pwd.outputs.workspace-folder }}
        run: |
          TREE_PATH="${{ steps.normalize.outputs.tree }}"
          BC_FILE="$TREE_PATH/BoardConfig.mk"
          MK_FILE="$TREE_PATH/${{ steps.normalize.outputs.makefile_name }}.mk"
          
          # 자동 생성기가 복사해 온 퀄컴 찌꺼기 라인들 전체 거세
          sed -i '/BOARD_KERNEL_CMDLINE/d' "$BC_FILE"
          
          # 실측 디바이스 기반 엑시노스 전용 그래픽 및 패널 파라미터 강제 오버라이딩 주입
          cat >> "$BC_FILE" << 'EOT'

          # ---- SM-T583 실측 정보 반영 디버깅 블록 ----
          BOARD_VENDOR := samsung
          TARGET_BOOTLOADER_BOARD_NAME := universal7870
          BOARD_KERNEL_CMDLINE := androidboot.hardware=gtaxladwifikx

          BOARD_RECOVERYIMAGE_PARTITION_SIZE := 39845888
          BOARD_RECOVERY_SCREEN_WIDTH := 1200
          BOARD_RECOVERY_SCREEN_HEIGHT := 1920
          TARGET_RECOVERY_PIXEL_FORMAT := "BGRA_8888"
          RECOVERY_GRAPHICS_USE_LINUX_FB := true

          TW_THEME := portrait_hdpi
          TW_SCREEN_BLANK_ON_BOOT := true
          TW_BRIGHTNESS_PATH := "/sys/class/backlight/panel/brightness"
          TW_MAX_BRIGHTNESS := 306
          TW_DEFAULT_BRIGHTNESS := 180
          BOARD_HAS_MTK_HARDWARE := false
          EOT
          
          # 메이크파일 내부 의존성 이름들도 일괄 실측값인 gtaxladwifikx로 강제 트레이싱
          if [ -f "$MK_FILE" ]; then
            sed -i 's/PRODUCT_RELEASE_NAME := .*/PRODUCT_RELEASE_NAME := gtaxladwifikx/g' "$MK_FILE"
            sed -i 's/PRODUCT_DEVICE := .*/PRODUCT_DEVICE := gtaxladwifikx/g' "$MK_FILE"
            sed -i 's/PRODUCT_MODEL := .*/PRODUCT_MODEL := SM-T583/g' "$MK_FILE"
            sed -i 's/PRODUCT_NAME := .*/PRODUCT_NAME := omni_gtaxladwifikx/g' "$MK_FILE"
            sed -i 's/aosp_base_telephony.mk/aosp_base_core.mk/g' "$MK_FILE"
          fi

      - name: Show generated tree
        working-directory: ${{ steps.pwd.outputs.workspace-folder }}
        run: |
          cd "${{ steps.normalize.outputs.tree }}"
          ls -l
          echo "== BoardConfig.mk =="
          cat BoardConfig.mk
          echo "== Product MakeFile == "
          cat ${{ steps.normalize.outputs.makefile_name }}.mk
          echo "== fstab =="
          find . -name "*.fstab" -exec sh -c 'echo "--- $1"; cat "$1"' _ {} \;

      - name: Sync Device Dependencies
        run: |
          if [ -f "${{ steps.normalize.outputs.tree }}/${{ steps.buildtree.outputs.value }}.dependencies" ]; then
            bash ${GITHUB_WORKSPACE}/scripts/convert.sh ${{ steps.normalize.outputs.tree }}/${{ steps.buildtree.outputs.value }}.dependencies
            repo sync -j4
          else
            echo "Dependencies file not found, skipping..."
          fi
        working-directory: ${{ steps.pwd.outputs.workspace-folder }}

      - name: Set Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 12

      - name: Switch to Python2
        run: |
          sudo apt -y install python2
          sudo ln -sf /usr/bin/python2 /usr/bin/python
          python --version

      - name: Building recovery
        run: |
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          lunch omni_gtaxladwifikx-eng
          make clean
          make ${{ github.event.inputs.BUILD_TARGET }}image -j$(nproc)
        working-directory: ${{ steps.pwd.outputs.workspace-folder }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TWRP-SM-T583-Build
          path: |
            workspace/out/target/product/gtaxladwifikx/recovery.img
