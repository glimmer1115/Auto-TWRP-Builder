- name: Normalize Device Tree
  id: normalize
  working-directory: ${{ steps.pwd.outputs.workspace-folder }}
  run: |
    set -e
    OLD_TREE="${{ steps.gdt.outputs.DEVICE_PATH }}"
    NEW_TREE="device/samsung/gtaxlwifi"
    echo "Old tree path: $OLD_TREE"
    if [ "$OLD_TREE" != "$NEW_TREE" ]; then
      mkdir -p device/samsung
      rm -rf "$NEW_TREE"
      if [ -d "$OLD_TREE" ]; then
        mv "$OLD_TREE" "$NEW_TREE"
      else
        echo "::error::Generated device tree path not found!"
        exit 1
      fi
    fi
    OLD_CODENAME=$(basename "$OLD_TREE")
    if [ -f "$NEW_TREE/omni_${OLD_CODENAME}.mk" ]; then
      mv "$NEW_TREE/omni_${OLD_CODENAME}.mk" "$NEW_TREE/omni_gtaxlwifi.mk"
    fi
    grep -RIl "$OLD_CODENAME" "$NEW_TREE" | xargs -r sed -i "s/${OLD_CODENAME}/gtaxlwifi/g"
    
    if [ -f "$NEW_TREE/Android.bp" ]; then
      sed -i '/soong_namespace/d' "$NEW_TREE/Android.bp" || true
      # 추가: 잘못 생성된 단독 닫는 중괄호 제거
      sed -i '/^\s*\}\s*$/d' "$NEW_TREE/Android.bp" || true
    fi
    echo "device_name=gtaxlwifi" >> $GITHUB_OUTPUT
    echo "makefile_name=gtaxlwifi" >> $GITHUB_OUTPUT
